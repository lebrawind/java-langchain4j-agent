<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>Agent 聊天室</title>
    <style>
        body { font-family: system-ui, sans-serif; background:#f5f6fa; max-width:640px; margin:30px auto; }
        h2 { text-align:center; color:#444; }
        #chat { background:#fff; border-radius:12px; padding:16px; height:420px; overflow-y:auto;
            box-shadow:0 1px 4px rgba(0,0,0,.1); }
        .msg { margin:8px 0; padding:10px 14px; border-radius:10px; white-space:pre-wrap; max-width:80%; }
        .user { background:#3b82f6; color:#fff; margin-left:auto; }
        .assistant { background:#e8eaf0; color:#222; }
        .bar { display:flex; gap:8px; margin-top:12px; }
        input { flex:1; padding:10px 14px; border:1px solid #ccc; border-radius:8px; font-size:15px; }
        button { padding:10px 20px; border:none; background:#3b82f6; color:#fff; border-radius:8px; cursor:pointer; }
    </style>
</head>
<body>
<h2>🤖 天气助手</h2>
<div id="chat"></div>
<div class="bar">
    <input id="input" placeholder="例如：查一下北京的天气" onkeydown="if(event.key==='Enter')send()">
    <button onclick="send()">发送</button>
</div>
<script>
    // 每次刷新页面生成新会话 ID —— 多用户隔离的现场演示
    const memoryId = "web-" + Date.now();
    const chat = document.getElementById("chat");

    function bubble(role) {
        const div = document.createElement("div");
        div.className = "msg " + role;
        chat.appendChild(div);
        chat.scrollTop = chat.scrollHeight;
        return div;
    }

    function send() {
        const input = document.getElementById("input");
        const message = input.value.trim();
        if (!message) return;
        input.value = "";
        bubble("user").textContent = message;
        const reply = bubble("assistant");

        const es = new EventSource(`/chat/stream?message=${encodeURIComponent(message)}&memoryId=${memoryId}`);
        es.onmessage = e => {
            if (e.data) { reply.textContent += e.data; chat.scrollTop = chat.scrollHeight; }
        };
        es.onerror = () => es.close();
    }
</script>
</body>
</html>
